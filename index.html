const toPl=s=>s.map(x=>x==''?0:x=='cpu'?2:1);
function lobby(){const m=me();$('#lc').textContent=L.code.toUpperCase();$('#ls').innerHTML=L.seats.map((x,c)=>`<div class="row" style="--c:${COL[c]}"><i></i><span>${NM[c]}</span><button class="tg" data-c="${c}">${x=='cpu'?'🤖 CPU':x?(x===m?'⭐ You':'👤 Player'):'＋ Open'}</button></div>`).join('');
 $('#st').style.display=L.host?'':'none';$('#st').disabled=L.seats.filter(x=>x).length<2;$('#wt2').textContent=L.host?'Tap an open seat to add a CPU':'Waiting for host to start…'}
function tick(){if(!R||!L)return;const ps=R.peers();
 if(L.host){
  if(!S.started){const m=ps.find(p=>p.isMe&&p.sameTab);if(!m)return;const st=L.seats.map(x=>x=='cpu'||ps.some(p=>p.peer==x)?x:'');
   [m,...ps.filter(p=>p!==m&&p.presence.h===0&&p.kind=='viewer')].forEach(p=>{if(!st.includes(p.peer)){const i=st.indexOf('');if(i>=0)st[i]=p.peer}});
   if(st+''!=L.seats+''){L.seats=st;R.presence({seats:st})}lobby()}
  else{const p=ps.find(q=>q.peer===S.seat[S.turn]&&!q.isMe),r=p&&p.presence.rq;
   if(r&&r.s===S.log.length){if(S.phase=='roll'&&r.k=='r')emit(rnd());else if(S.phase=='pick'&&r.k=='m'&&S.mv.includes(r.i))emit(ch2(r.i))}auto()}
 }else{
  const h=ps.find(p=>p.presence.h===1&&!p.isMe);if(!h){if(L.seen)leave('The host left the game');return}
  L.seen=1;const pr=h.presence;
  if(!S.started){if(Array.isArray(pr.seats))L.seats=pr.seats;if(pr.go)startGame(toPl(L.seats),L.seats,1,0);else lobby()}
  if(S.started&&typeof pr.lg=='string'&&pr.lg.length>S.log.length&&pr.lg.startsWith(S.log)){S.log=pr.lg;pump()}
 }}
async function goOnline(code,host){const err=m=>$('#err').textContent=m;if(!/^[a-z0-9]{3,8}$/.test(code))return err('Enter a room code (3–8 letters or numbers)');err('Connecting…');
 try{R=await joinRoom(code)}catch(e){R=null;return err('Could not reach the game server.')}
 L={seats:['','','',''],code,host};R.presence({h:host?1:0});R.onPeers(tick);
 if(!host){await wait(2500);if(!R)return;if(!peers().some(p=>p.presence.h===1&&!p.isMe)){R.leave();R=null;L=null;return err('Room not found — check the code.')}}
 err('');show('lobby');lobby()}
function joinRoom(code){return new Promise((ok,no)=>{const id=Math.random().toString(36).slice(2,10)+Date.now().toString(36),q='?room=ludo-'+code+'&id='+id;let ps=[],cb=[],mine={},chain=Promise.resolve(),first=1;const es=new EventSource('/e'+q);
 const post=o=>{chain=chain.then(()=>fetch('/p'+q,{method:'POST',body:JSON.stringify(o),keepalive:true})).catch(()=>{})};
 const Rm={presence(p){for(const k in p)p[k]===null?delete mine[k]:mine[k]=p[k];post(p);return Promise.resolve()},peers:()=>ps,onPeers(f){cb.push(f);return()=>{}},leave(){es.close();return Promise.resolve()}};
 es.onopen=()=>{if(first){first=0;ok(Rm)}else if(Object.keys(mine).length)post(mine)};
 es.onmessage=e=>{ps=JSON.parse(e.data).map(x=>({peer:x.id,isMe:x.id==id,sameTab:x.id==id,kind:'viewer',presence:x.p}));cb.forEach(f=>f())};
 es.onerror=()=>{if(first){es.close();no()}}})}
let nc=3;
$('#play').onclick=()=>{$('#tm').textContent='';show('mode')};
$('#quit').onclick=()=>{show('bye');try{window.close()}catch(e){}};
$('#back').onclick=$('#bk').onclick=()=>show('title');
$('#seg').onclick=e=>{const n=+e.target.dataset.n;if(!n)return;nc=n;[...$('#seg').children].forEach(b=>b.classList.toggle('a',b.dataset.n==n))};
$('#cpu').onclick=()=>startGame(nc==1?[1,0,2,0]:nc==2?[1,2,2,0]:[1,2,2,2],[],0,0);
$('#mk').onclick=()=>goOnline(Array.from({length:4},()=>'abcdefghjkmnpqrstuvwxyz23456789'[Math.random()*31|0]).join(''),1);
$('#jn').onclick=()=>goOnline($('#code').value.trim().toLowerCase(),0);
$('#ls').onclick=e=>{const c=e.target.dataset.c;if(c==null||!L||!L.host)return;const x=L.seats[c];if(x==''||x=='cpu'){L.seats=L.seats.map((y,i)=>i==c?(x?'':'cpu'):y);R.presence({seats:L.seats});lobby()}};
$('#st').onclick=()=>{const s=L.seats;R.presence({go:1,lg:''});startGame(toPl(s),s,1,1)};
$('#lv').onclick=()=>leave();
$('#again').onclick=()=>startGame(...LAST,0,0);
$('#m2').onclick=$('#mn').onclick=()=>leave();
$('#snd').onclick=e=>{mute=!mute;e.target.textContent=mute?'🔇':'🔊'};
$('#dice').innerHTML='<i class=d></i>'.repeat(9);face(1);
$('#dice').onclick=()=>{if(S.phase=='roll'&&mine(S.turn))req('r')};
cv.onpointerdown=e=>{if(S.phase!='pick'||!mine(S.turn))return;const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*15,y=(e.clientY-r.top)/r.height*15;let b=null,bd=1.2;
 S.mv.forEach(i=>{const o=S.pcs[S.turn][i],d=Math.hypot(o.x-x,o.y-y);if(d<bd){bd=d;b=i}});if(b!=null)req('m',b)};
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
